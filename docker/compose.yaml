name: glim_localization

services:
  dev:
    # scripts/ci_local.sh sets GLIM_LOC_IMAGE to a private tag of the image it verified.
    image: ${GLIM_LOC_IMAGE:-glim_localization:dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        JOBS: ${JOBS:-4}
    working_dir: /ws/src/glim_localization
    environment:
      - CTEST_JOBS  # Passed through from the host only when set.
    volumes:
      - ..:/ws/src/glim_localization
      - build:/ws/build
      - ../out:/ws/out

  # CUDA variant (amd64 + NVIDIA GPU + NVIDIA Container Toolkit). Only used when named, so
  # `docker compose build` and scripts/docker_run.sh without --cuda keep using the CPU image.
  # Build: docker compose -f docker/compose.yaml build dev-cuda; run: scripts/docker_run.sh --cuda ...
  dev-cuda:
    profiles: [cuda]
    image: ${GLIM_LOC_CUDA_IMAGE:-glim_localization:dev-cuda}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.cuda
      args:
        JOBS: ${JOBS:-4}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-75}
    # All GPUs. The device reservation form instead of `gpus: all`: Compose before v2.30 rejects the
    # `gpus` key while validating the whole file, which would break the CPU service too.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /ws/src/glim_localization
    environment:
      - CTEST_JOBS
      - GLIM_LOC_REQUIRE_GPU  # 1: the GPU tests fail instead of skipping when no GPU is visible.
    volumes:
      - ..:/ws/src/glim_localization
      - build-cuda:/ws/build  # Separate from the CPU build tree.
      - ../out:/ws/out

volumes:
  build:
  build-cuda:
