# Project site, built with Zensical (https://zensical.org) and published on GitHub Pages by
# .github/workflows/docs.yml. The pages are the Markdown files under docs/ as they read on GitHub;
# the home page docs/index.md is generated from README.md by scripts/docs_site_index.py.
# Local build (Python 3.12):
#   pip install -r requirements-docs.txt
#   scripts/docs_site_index.py && zensical build --strict    # output in site/
[project]
site_name = "glim_localization"
site_description = "LiDAR-IMU localization on a prebuilt 3D map, built on GLIM"
site_url = "https://atinfinity.github.io/glim_localization/"
repo_url = "https://github.com/atinfinity/glim_localization"
repo_name = "atinfinity/glim_localization"
copyright = "Copyright (c) 2026 atinfinity. MIT License."
docs_dir = "docs"
site_dir = "site"

# Development records: built, so that links to them work, but kept out of the navigation.
not_in_nav = """
/PROGRESS.md
/IMPLEMENTATION_PLAN.md
/progress/
"""

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting_started.md" },
  { "Build (Docker)" = "build.md" },
  { "Map preparation" = "maps.md" },
  { "Offline replay and evaluation" = "replay.md" },
  { "Simulation evaluation" = "sim_eval.md" },
  { "ROS 2" = "ros2.md" },
  { "Configuration reference" = "https://atinfinity.github.io/glim_localization/DESIGN/#55-configuration-example" },
  { "Limitations" = "status.md" },
  { "Design" = "DESIGN.md" },
  { "Dependencies" = "DEPENDENCIES.md" },
]

[project.theme]
features = ["navigation.sections", "content.code.copy"]
