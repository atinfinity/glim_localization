name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Check the open issues and the Limitations section of docs/status.md first; some features are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Sensor, mode (R1, R2 or offline replay), map type, or other details that matter.
