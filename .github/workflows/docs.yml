name: Docs

# Builds the project site (zensical.toml) with warnings as errors. Pull requests only build it; a
# push to main (or a manual run on main) also deploys it to GitHub Pages. Runs only when the site
# inputs change; the C++ CI in ci.yml is independent of it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - 'scripts/docs_site_index.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:  # the same list as for push
      - 'docs/**'
      - 'README.md'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - 'scripts/docs_site_index.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A new push to a pull request cancels its older run. On main, runs wait for each other instead, so
# a deployment that started is never cancelled halfway; the deploy job also has its own group.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Zensical
        run: python -m pip install -r requirements-docs.txt
      # --strict aborts the build on any warning, for example a broken link or anchor.
      - name: Build the site
        run: |
          python scripts/docs_site_index.py
          zensical build --clean --strict
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  # Needs GitHub Pages enabled with "GitHub Actions" as the source (repository settings). Skipped until the
  # repository variable PAGES_ENABLED is 'true', so main does not fail, and the github-pages environment is not
  # created without its branch rule, before Pages is set up.
  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && github.repository == 'atinfinity/glim_localization' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify that the deployment comes from this workflow
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
